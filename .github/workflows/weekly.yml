# Runs the weekly job and sends the proposals to the approval page.
#
# The job runs here rather than on the host because it fetches a few
# megabytes of player data and a couple of articles, which is comfortably
# longer than a serverless function is allowed to live. Here it has hours.
name: weekly waiver job

on:
  schedule:
    # Monday 21:00 US Pacific, after Monday night football, so the proposals
    # account for the last game of the week and are waiting on Tuesday
    # morning. That is Tuesday in UTC, which is what cron reads. GitHub cron
    # ignores daylight saving, so both offsets are listed; the host ignores a
    # second run in the same week.
    - cron: "0 4 * * 2"   # Mon 21:00 PDT
    - cron: "0 5 * * 2"   # Mon 21:00 PST
  workflow_dispatch:
    inputs:
      force:
        description: "Propose again even if this week already ran"
        type: boolean
        default: false

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Work out this week's moves and send them
        env:
          FANTASY_API_URL: ${{ secrets.FANTASY_API_URL }}
          FANTASY_API_TOKEN: ${{ secrets.FANTASY_API_TOKEN }}
          FANTASY_USER: ${{ secrets.FANTASY_USER }}
        run: |
          python3 run_weekly.py "$FANTASY_USER" \
            ${{ inputs.force && '--force' || '' }}
