# fly launch --no-deploy   then   fly deploy
app = "fantasy-waivers"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8777
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Stays up: the weekly job runs in this process, and a suspended
  # machine would sleep straight through Tuesday morning.
  min_machines_running = 1

  [http_service.http_options.response]
    pristine = true

# Proposals must outlive a redeploy.
[mounts]
  source = "fantasy_data"
  destination = "/data"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
